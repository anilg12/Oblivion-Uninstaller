<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 92" width="420" height="92" role="img" aria-label="Mac için indir — macOS 14+ — Apple Silicon ve Intel">
  <title>Mac için indir — macOS 14+ — Apple Silicon ve Intel</title>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="418" height="90" rx="15"/></clipPath>
    <style>
      text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .shine { animation: shine 5s ease-in-out infinite 2.6s; }
      .nudge { animation: nudge 2.4s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-180px); } 40%, 100% { transform: translateX(460px); } }
      @keyframes nudge { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(3px); } }
      @media (prefers-reduced-motion: reduce) { .shine, .nudge { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="418" height="90" rx="15" fill="#1C1C1F" stroke="#2A2A2F" stroke-width="1.5"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="160" height="92" fill="url(#shine)"/></g>
  <rect x="20" y="20" width="52" height="52" rx="12" fill="#26262A" fill-opacity="1"/>
  <g transform="translate(33 34)"><g fill="none" stroke="#EDEDEF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="2" width="20" height="15" rx="2.5"/><path d="M0 22h26"/></g></g>
  <text x="90" y="42" font-size="20" font-weight="600" fill="#EDEDEF">Mac için indir</text>
  <text x="90" y="66" font-size="14" fill="#A3A3AA">macOS 14+ — Apple Silicon ve Intel</text>
  <g transform="translate(374 34)"><g class="nudge" fill="none" stroke="#A3B4FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2v18M4 13l8 8 8-8"/>
  </g></g>
</svg>
