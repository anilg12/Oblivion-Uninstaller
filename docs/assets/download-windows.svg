<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 92" width="420" height="92" role="img" aria-label="Windows için indir — Windows 10 · 11 — kurulum sihirbazı">
  <title>Windows için indir — Windows 10 · 11 — kurulum sihirbazı</title>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="418" height="90" rx="15"/></clipPath>
    <style>
      text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .shine { animation: shine 5s ease-in-out infinite 1.2s; }
      .nudge { animation: nudge 2.4s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-180px); } 40%, 100% { transform: translateX(460px); } }
      @keyframes nudge { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(3px); } }
      @media (prefers-reduced-motion: reduce) { .shine, .nudge { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="418" height="90" rx="15" fill="#4F6BED" stroke="#4F6BED" stroke-width="1.5"/>
  <g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="160" height="92" fill="url(#shine)"/></g>
  <rect x="20" y="20" width="52" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.16"/>
  <g transform="translate(33 33)"><g fill="#FFFFFF"><rect x="0" y="0" width="12" height="12" rx="1.5"/><rect x="14" y="0" width="12" height="12" rx="1.5"/><rect x="0" y="14" width="12" height="12" rx="1.5"/><rect x="14" y="14" width="12" height="12" rx="1.5"/></g></g>
  <text x="90" y="42" font-size="20" font-weight="600" fill="#FFFFFF">Windows için indir</text>
  <text x="90" y="66" font-size="14" fill="#DCE3FF">Windows 10 · 11 — kurulum sihirbazı</text>
  <g transform="translate(374 34)"><g class="nudge" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2v18M4 13l8 8 8-8"/>
  </g></g>
</svg>
