<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="1200" height="84" role="img" aria-label="İndir">
  <title>İndir</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F6BED"/><stop offset="0.6" stop-color="#4F6BED" stop-opacity="0.15"/><stop offset="1" stop-color="#4F6BED" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="84" rx="16"/></clipPath>
    <style>
      text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .draw { animation: draw 1.4s cubic-bezier(.2,.7,.2,1) both .15s; transform-origin: 0 0; }
      .in { animation: in .8s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .draw, .in { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="84" fill="#141416"/>
    <rect width="1200" height="84" fill="url(#grid)"/>
    <rect class="draw" x="0" y="82" width="1200" height="2" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="83" rx="15.5" fill="none" stroke="#2A2A2F"/>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3038"/><stop offset="1" stop-color="#16171B"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5D6DC"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/></pattern>
</defs>
  <g class="in">
    <rect x="28" y="24" width="44" height="36" rx="9" fill="#4F6BED" fill-opacity="0.16" stroke="#4F6BED" stroke-opacity="0.45"/>
    <text x="50" y="48" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#A3B4FF">03</text>
    <text x="92" y="52" font-size="27" font-weight="600" letter-spacing="-0.4" fill="#EDEDEF">İndir<tspan fill="#6E6E76" font-size="17" font-weight="400" dx="16">Ücretsiz ve açık kaynak</tspan></text>
  </g>
</svg>
