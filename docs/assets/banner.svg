<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Oblivion — uninstaller and system cleaner for Windows and macOS">
  <title>Oblivion — uninstaller and system cleaner for Windows and macOS</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3038"/><stop offset="1" stop-color="#16171B"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5D6DC"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#141416" stop-opacity="0"/><stop offset="1" stop-color="#141416" stop-opacity="1"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <style>
      .in1 { animation: rise .7s cubic-bezier(.2,.7,.2,1) both .05s; }
      .in2 { animation: rise .7s cubic-bezier(.2,.7,.2,1) both .18s; }
      .in3 { animation: rise .7s cubic-bezier(.2,.7,.2,1) both .30s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .in1, .in2, .in3 { animation: none; } }
      text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#141416"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="600" width="600" height="320" rx="20" fill="url(#fade)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#2A2A2F"/>

  <g class="in1">
    <rect x="96" y="70" width="200" height="200" rx="45" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="96" y="60" width="200" height="200" rx="45" fill="url(#tile)"/>
    <rect x="97" y="61" width="198" height="198" rx="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 243.64 136.77 A 53.0 53.0 0 1 1 217.56 111.58" fill="none" stroke="url(#ring)" stroke-width="19.6" stroke-linecap="round"/>
<circle cx="234.18" cy="120.47" r="7.06" fill="#8EA2FF" fill-opacity="1.0"/>
<circle cx="254.71" cy="112.46" r="4.70" fill="#8EA2FF" fill-opacity="0.8"/>
<circle cx="273.33" cy="109.78" r="2.74" fill="#8EA2FF" fill-opacity="0.55"/>
  </g>

  <g class="in2">
    <text x="360" y="150" font-size="76" font-weight="600" letter-spacing="-1.5" fill="#EDEDEF">Oblivion</text>
    <text x="362" y="196" font-size="24" font-weight="400" fill="#A3A3AA">Uninstaller &amp; system cleaner for Windows and macOS</text>
  </g>

  <g class="in3" font-size="15" font-weight="600">
    <rect x="362" y="226" width="140" height="32" rx="8" fill="#1C1C1F" stroke="#2A2A2F"/>
    <text x="432" y="247" text-anchor="middle" fill="#EDEDEF">Windows 10 · 11</text>
    <rect x="514" y="226" width="112" height="32" rx="8" fill="#1C1C1F" stroke="#2A2A2F"/>
    <text x="570" y="247" text-anchor="middle" fill="#EDEDEF">macOS 14+</text>
    <rect x="638" y="226" width="196" height="32" rx="8" fill="#1C1C1F" stroke="#2A2A2F"/>
    <text x="736" y="247" text-anchor="middle" fill="#EDEDEF">Apple Silicon + Intel</text>
    <rect x="846" y="226" width="72" height="32" rx="8" fill="#4F6BED" fill-opacity="0.18" stroke="#4F6BED" stroke-opacity="0.45"/>
    <text x="882" y="247" text-anchor="middle" fill="#A3B4FF">v3.0</text>
  </g>
</svg>
