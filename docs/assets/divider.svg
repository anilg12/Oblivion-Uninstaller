<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E5BFF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#6E5BFF"/>
      <stop offset="0.5" stop-color="#B45BFF"/>
      <stop offset="0.8" stop-color="#3A8DFF"/>
      <stop offset="1" stop-color="#3A8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .run { animation: run 4.5s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateX(-200px); } 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#g)"/>
  <rect class="run" x="0" y="9" width="200" height="6" rx="3" fill="url(#spark)"/>
</svg>
