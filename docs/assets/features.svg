<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 412" width="1200" height="412" role="img" aria-label="Oblivion özellikleri">
  <title>Oblivion özellikleri</title>
  <defs>
    <style>
      text { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
      .card { animation: up .7s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
    </style>
  </defs>
  <g class="card" style="animation-delay:0.00s">
    <rect x="0.5" y="0.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="28.0" y="26" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(38.0 36)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></g>
    
    <text x="28.0" y="104" font-size="19" font-weight="600" fill="#EDEDEF">İz bırakmadan kaldırma</text>
    <text x="28.0" y="134" font-size="14.5" fill="#A3A3AA"><tspan x="28.0" dy="0">Programı kendi kaldırıcısıyla kaldırır,</tspan><tspan x="28.0" dy="22">sonra dosya ve kayıt kalıntılarını bulur.</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.08s">
    <rect x="407.1666666666667" y="0.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="434.6666666666667" y="26" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(444.6666666666667 36)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2.5-6 4 13 3-9 1.5 2H22"/></g>
    <rect x="722.9333333333334" y="30" width="42.4" height="22" rx="6" fill="#4F6BED" fill-opacity="0.16"/><text x="744.1333333333333" y="45.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing=".6" fill="#A3B4FF">YENİ</text>
    <text x="434.6666666666667" y="104" font-size="19" font-weight="600" fill="#EDEDEF">Canlı sistem izleyici</text>
    <text x="434.6666666666667" y="134" font-size="14.5" fill="#A3A3AA"><tspan x="434.6666666666667" dy="0">İşlemci, bellek, sıcaklık, ağ, diskler, pil</tspan><tspan x="434.6666666666667" dy="22">ve en yoğun işlemler — anlık.</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.16s">
    <rect x="813.8333333333334" y="0.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="841.3333333333334" y="26" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(851.3333333333334 36)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></g>
    
    <text x="841.3333333333334" y="104" font-size="19" font-weight="600" fill="#EDEDEF">Güvenli temizlik</text>
    <text x="841.3333333333334" y="134" font-size="14.5" fill="#A3A3AA"><tspan x="841.3333333333334" dy="0">Hiçbir şey kendiliğinden seçilmez. Silinecek</tspan><tspan x="841.3333333333334" dy="22">her dosyayı tek tek görürsün.</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.24s">
    <rect x="0.5" y="216.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="28.0" y="242" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(38.0 252)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></g>
    
    <text x="28.0" y="320" font-size="19" font-weight="600" fill="#EDEDEF">Avcı modu</text>
    <text x="28.0" y="350" font-size="14.5" fill="#A3A3AA"><tspan x="28.0" dy="0">Bir pencereye nişan al; Oblivion programı</tspan><tspan x="28.0" dy="22">bulsun, kapatsın ya da kaldırsın.</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.32s">
    <rect x="407.1666666666667" y="216.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="434.6666666666667" y="242" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(444.6666666666667 252)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></g>
    
    <text x="434.6666666666667" y="320" font-size="19" font-weight="600" fill="#EDEDEF">Başlangıç yöneticisi</text>
    <text x="434.6666666666667" y="350" font-size="14.5" fill="#A3A3AA"><tspan x="434.6666666666667" dy="0">Açılışta çalışan öğeleri silmeden kapat,</tspan><tspan x="434.6666666666667" dy="22">istediğinde yeniden aç.</tspan></text>
  </g>
  <g class="card" style="animation-delay:0.40s">
    <rect x="813.8333333333334" y="216.5" width="385.6666666666667" height="195" rx="16" fill="#1C1C1F" stroke="#2A2A2F"/>
    <rect x="841.3333333333334" y="242" width="44" height="44" rx="11" fill="#26262A" stroke="#2A2A2F"/>
    <g transform="translate(851.3333333333334 252)" fill="none" stroke="#EDEDEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6.2c0 4.6-3.3 8.4-8 9.8-4.7-1.4-8-5.2-8-9.8V5.5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
    
    <text x="841.3333333333334" y="320" font-size="19" font-weight="600" fill="#EDEDEF">Önce güvenlik</text>
    <text x="841.3333333333334" y="350" font-size="14.5" fill="#A3A3AA"><tspan x="841.3333333333334" dy="0">Her silmeden önce tam liste ve onay. Sistem</tspan><tspan x="841.3333333333334" dy="22">klasörleri asla önerilmez.</tspan></text>
  </g>
</svg>
