name: Build Oblivion for macOS

on:
  push:
    branches: [ "**" ]
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "macos/**"
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Push the self-test screenshots to the ci-snapshots-mac branches"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Apple Silicon runner: builds all three DMGs, runs the full self-test on the
  # universal app, checks the thin Apple Silicon app starts, tests the installer.
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            macos
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc|release' | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
          sw_vers
          uname -m

      # Optional: Apple Developer ID signing + notarization (no Gatekeeper warning).
      # Add these repository secrets to enable it: MACOS_CERT_P12 (base64 of the
      # "Developer ID Application" .p12), MACOS_CERT_PASSWORD, APPLE_ID,
      # APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password).
      - name: Import Developer ID certificate (if configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No Developer ID secrets: building with an ad-hoc signature."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "Signing identity: $ID"
          echo "DEVELOPER_ID=$ID" >> "$GITHUB_ENV"

      - name: Build apps and DMGs
        working-directory: macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-macOS
          path: macos/build/*.dmg
          if-no-files-found: error

      - name: Smoke test (universal app — every page, fixtures, nothing pre-selected)
        working-directory: macos
        run: |
          chmod +x ci-smoke-test.sh
          ./ci-smoke-test.sh

      - name: Apple Silicon build starts
        working-directory: macos
        run: |
          lipo -archs build/arm64/Oblivion.app/Contents/MacOS/Oblivion
          build/arm64/Oblivion.app/Contents/MacOS/Oblivion > build/arm64-launch.txt 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            cat build/arm64-launch.txt
            echo "::error::The Apple Silicon build quit or crashed on launch"; exit 1
          fi
          kill "$PID"
          echo "Apple Silicon build OK"

      - name: Test the one-line installer (install-mac.sh)
        working-directory: macos
        run: |
          chmod +x install-mac.sh
          OBLIVION_DMG="$(ls build/*-AppleSilicon.dmg | head -1)" OBLIVION_NO_OPEN=1 ./install-mac.sh
          test -x /Applications/Oblivion.app/Contents/MacOS/Oblivion
          codesign --verify --verbose=2 /Applications/Oblivion.app
          if xattr -p com.apple.quarantine /Applications/Oblivion.app 2>/dev/null; then
            echo "::error::quarantine flag still present"; exit 1
          fi
          echo "installer OK: Oblivion.app installed, signed, no quarantine flag"

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-macOS-screenshots
          path: macos/build/snapshots
          if-no-files-found: warn

      - name: Push screenshots to the ci-snapshots-mac branch
        if: always() && inputs.snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SNAP="$GITHUB_WORKSPACE/macos/build/snapshots"
          [ -d "$SNAP" ] && [ -n "$(ls -A "$SNAP")" ] || { echo "No snapshots."; exit 0; }
          cd "$SNAP"
          git init -q -b ci-snapshots-mac
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "macOS self-test screenshots"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots-mac

  # Intel runner: the full self-test on the Intel-only app (SMC temperature path).
  intel:
    runs-on: macos-15-intel
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            macos
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc|release' | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version
          sw_vers
          uname -m

      - name: Build
        working-directory: macos
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Smoke test (Intel app)
        working-directory: macos
        run: |
          chmod +x ci-smoke-test.sh
          OBLIVION_APP="$PWD/build/x86_64/Oblivion.app" ./ci-smoke-test.sh

      - name: Push screenshots to the ci-snapshots-mac-intel branch
        if: always() && inputs.snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SNAP="$GITHUB_WORKSPACE/macos/build/snapshots"
          [ -d "$SNAP" ] && [ -n "$(ls -A "$SNAP")" ] || { echo "No snapshots."; exit 0; }
          cd "$SNAP"
          git init -q -b ci-snapshots-mac-intel
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "macOS (Intel) self-test screenshots"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots-mac-intel
