name: Build Oblivion for macOS

on:
  push:
    branches: [ "**" ]
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  pull_request:
    paths:
      - "macos/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the DMG to this existing release (e.g. v2.0.0). Leave empty to skip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          # The repo also contains large Windows build folders; only fetch macos/.
          sparse-checkout: |
            macos
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc|release' | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build app and DMG
        working-directory: macos
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-macOS
          path: macos/build/*.dmg
          if-no-files-found: error

      - name: Smoke test (launch, capture every page, uninstall fixture apps)
        working-directory: macos
        run: |
          chmod +x ci-smoke-test.sh
          ./ci-smoke-test.sh

      - name: Test the one-line installer (install-mac.sh)
        working-directory: macos
        run: |
          chmod +x install-mac.sh
          OBLIVION_DMG="$(ls build/*.dmg | head -1)" OBLIVION_NO_OPEN=1 ./install-mac.sh
          test -x /Applications/Oblivion.app/Contents/MacOS/Oblivion
          codesign --verify --verbose=2 /Applications/Oblivion.app
          if xattr -p com.apple.quarantine /Applications/Oblivion.app 2>/dev/null; then
            echo "::error::quarantine flag still present"; exit 1
          fi
          echo "installer OK: Oblivion.app installed, signed, no quarantine flag"

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oblivion-macOS-screenshots
          path: macos/build/snapshots
          if-no-files-found: warn

      - name: Attach DMG to release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release upload "$TAG" macos/build/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
          # Add the macOS section to the release notes once (before the footer line).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          if ! grep -q "🍏 macOS" body.md; then
            python3 - <<'PY'
          body = open("body.md", encoding="utf-8").read().replace("\r\n", "\n")
          mac = open("macos/release-notes-macos.md", encoding="utf-8").read().strip()
          marker = "\n---\n"
          i = body.rfind(marker)
          body = body[:i] + "\n" + mac + "\n" + body[i:] if i != -1 else body + "\n\n" + mac + "\n"
          open("body.md", "w", encoding="utf-8").write(body)
          PY
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          fi
